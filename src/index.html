<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenCode - By HowieSun</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶部工具栏 -->
  <header class="toolbar">
    <div class="toolbar-left">
      <span class="logo">ZenCode</span>
      <select id="language-select">
        <option value="project" selected>Project</option>
        <option value="web">Web Project</option>
      </select>
    </div>
    <div class="toolbar-right">
      <button id="run-btn" title="运行代码 (Ctrl+Enter)">&#9654; 运行</button>
    </div>
  </header>

  <!-- 主体区域 -->
  <div class="main-container">
    <!-- 左侧 Explore 面板 -->
    <aside id="sidebar" class="sidebar hidden">
      <div class="sidebar-header">
        <span>Explorer</span>
        <div class="sidebar-actions">
          <button id="new-file-btn" title="新建文件">&#43;</button>
          <button id="new-folder-btn" title="新建文件夹">&#128193;</button>
        </div>
      </div>
      <div id="file-tree" class="file-tree"></div>
    </aside>
    <!-- 侧边栏拖拽手柄 -->
    <div id="sidebar-resizer" class="resizer resizer-col hidden"></div>

    <!-- 右侧编辑区 -->
    <div class="editor-area">
      <!-- Tab 栏（Web 项目模式下显示）-->
      <div id="tab-bar" class="tab-bar hidden"></div>

      <!-- 编辑区主体 -->
      <div class="workspace">
        <div class="editor-pane">
          <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
            placeholder="在这里写代码..."></textarea>
          <div id="autocomplete-popup" class="autocomplete-popup hidden"></div>
        </div>

        <!-- 输出面板拖拽手柄 -->
        <div id="output-resizer" class="resizer resizer-row"></div>

        <div class="output-pane">
          <div class="output-header">
            <span>输出</span>
            <div class="output-header-right">
              <button id="toggle-stdin" title="输入数据 (stdin)">stdin</button>
              <button id="clear-output" title="清空输出">&#10005;</button>
            </div>
          </div>
          <div id="stdin-area" class="stdin-area hidden">
            <textarea id="stdin-input" placeholder="程序运行前会读取此处的输入 (stdin)..." rows="3"></textarea>
          </div>
          <pre id="output-content"></pre>
        </div>
      </div>
    </div>

    <!-- Web 预览拖拽手柄 -->
    <div id="preview-resizer" class="resizer resizer-col hidden"></div>
    <!-- Web 预览 iframe -->
    <iframe id="web-preview" class="hidden" sandbox="allow-scripts"></iframe>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
