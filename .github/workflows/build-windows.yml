name: ZenCode Java checks and Windows product

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
  windows-product:
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f releng/pom.xml verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-product.py
      - run: python scripts/test-jdt-integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZenCode-Windows-x64-prototype
          path: products/cn.zencode.product/target/products/*.zip
          if-no-files-found: error
