name: Build ZenCode Windows EXE

on:
  push:
    branches: [ main, master ] # 当你推送到 main 或 master 分支时触发
  workflow_dispatch: # 允许你在 GitHub 网页上通过按钮手动触发

jobs:
  build:
    runs-on: windows-latest # 划重点：白嫖微软的高配 Windows 服务器

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      # 这一步极其关键：它会触发 prebuild 钩子，自动下载 Python 和 GCC
      # 然后 Tauri 会把它们和你的代码一起打包成一个 .exe
      - name: Build Tauri App
        run: npm run build

      # 将生成的 .exe 提取出来供你下载
      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenCode-Windows-Installer
          # Tauri v2 默认会生成 NSIS 安装程序，这是给机房的完美单文件
          path: src-tauri/target/release/bundle/nsis/*.exe